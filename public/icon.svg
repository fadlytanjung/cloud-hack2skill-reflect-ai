<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6b42" />
      <stop offset="50%" stop-color="#34522f" />
      <stop offset="100%" stop-color="#1f341b" />
    </linearGradient>
    <linearGradient id="petal-center" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#dcead9" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="petal-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6d8b0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#739a6c" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="petal-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cde5c9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8ba784" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6dd" />
      <stop offset="50%" stop-color="#f5c253" />
      <stop offset="100%" stop-color="#d9822b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Backdrop -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg-grad)" stroke="#688c60" stroke-width="2" />

  <!-- Subtle Inner Aura Circle -->
  <circle cx="64" cy="64" r="44" stroke="#7ea375" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Lotus Petal Left -->
  <path d="M64 78 C48 76 34 62 38 46 C42 58 52 70 64 78 Z" fill="url(#petal-left)" opacity="0.9" />

  <!-- Lotus Petal Right -->
  <path d="M64 78 C80 76 94 62 90 46 C86 58 76 70 64 78 Z" fill="url(#petal-right)" opacity="0.9" />

  <!-- Outer Wide Leaves -->
  <path d="M64 82 C38 80 24 66 26 58 C32 72 48 80 64 82 Z" fill="#8ba784" opacity="0.6" />
  <path d="M64 82 C90 80 104 66 102 58 C96 72 80 80 64 82 Z" fill="#72946a" opacity="0.6" />

  <!-- Center Floating Petal / Mirror Flame -->
  <path d="M64 28 C56 46 52 64 64 80 C76 64 72 46 64 28 Z" fill="url(#petal-center)" />

  <!-- Inner Mind Sparkle / Insight Light -->
  <g filter="url(#glow)">
    <path d="M64 42 Q64 54 54 54 Q64 54 64 66 Q64 54 74 54 Q64 54 64 42 Z" fill="url(#sparkle-grad)" />
    <circle cx="64" cy="54" r="2.5" fill="#ffffff" />
  </g>

  <!-- Floating Meditation Ripples / Reflection Waves below -->
  <path d="M48 90 Q64 94 80 90" stroke="#b6d8b0" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M54 97 Q64 100 74 97" stroke="#8ba784" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
